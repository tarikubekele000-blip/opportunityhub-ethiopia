<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpportunityHub Ethiopia</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>OpportunityHub Ethiopia</h1>
    <p>Find scholarships, competitions, camps, and programs for Grades 9-12.</p>
  </header>

  <main>
    <div class="filters">
      <input type="text" id="search" placeholder="Search opportunities...">
      <select id="category">
        <option value="">All categories</option>
        <option>Scholarship</option>
        <option>Competition</option>
        <option>Camp</option>
        <option>Technology</option>
        <option>Course</option>
        <option>Volunteering</option>
      </select>
      <select id="grade">
        <option value="">All grades</option>
        <option>9</option>
        <option>10</option>
        <option>11</option>
        <option>12</option>
      </select>
    </div>

    <p class="notice">Note: the listings below are sample data for testing only.</p>
    <div id="list"></div>
  </main>

  <footer>OpportunityHub Ethiopia. Always confirm details on the official page.</footer>
  <script src="app.js"></script>
</body>
</html>
